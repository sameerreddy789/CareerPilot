<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication | NextStep AI</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/auth-modern.css">
    <link rel="stylesheet" href="css/ui-utils.css">
    <link rel="stylesheet" href="css/theme-toggle.css">
    <script>(function(){var t=localStorage.getItem('nextStep_theme')||'dark';document.documentElement.setAttribute('data-theme',t);})()</script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="js/env-config.js"></script>
    <script src="js/ui-utils.js"></script>
    <script src="js/error-handler.js"></script>
</head>

<body>
    <div class="auth-container">
        <!-- Left Side: Auth Form -->
        <div class="auth-sidebar">
            <div class="auth-card">
                <div class="auth-header">
                    <h1 class="auth-title" id="auth-title">Welcome back</h1>
                    <p class="auth-subtitle" id="auth-subtitle">Sign in to your account to continue</p>
                </div>

                <div class="card-content">
                    <!-- Login View -->
                    <div id="login-view">
                        <form id="form-login">
                            <div class="form-group">
                                <label class="form-label" for="login-email">Email</label>
                                <div class="input-wrapper">
                                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <rect width="20" height="16" x="2" y="4" rx="2" />
                                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                                    </svg>
                                    <input type="email" id="login-email" class="form-input"
                                        placeholder="name@example.com" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="login-password">Password</label>
                                <div class="input-wrapper">
                                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                    </svg>
                                    <input type="password" id="login-password" class="form-input"
                                        placeholder="Enter your password" required>
                                    <button type="button" class="toggle-password"
                                        onclick="togglePassword('login-password', this)">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                            stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                                            <circle cx="12" cy="12" r="3" />
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary">Sign In</button>
                        </form>

                        <div class="divider"><span>Or continue with</span></div>

                        <button class="btn btn-outline" onclick="handleGoogleAuth()">
                            <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path fill="#4285F4"
                                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                                <path fill="#34A853"
                                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                                <path fill="#FBBC05"
                                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                                <path fill="#EA4335"
                                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                            </svg>
                            Continue with Google
                        </button>

                        <div class="footer-link">
                            Don't have an account? <a href="#" onclick="toggleView('signup')">Sign up</a>
                        </div>

                    </div>

                    <!-- Signup View -->
                    <div id="signup-view" class="hidden">
                        <form id="form-signup" class="auth-form">
                            <div class="form-group">
                                <label class="form-label" for="signup-email">Email</label>
                                <div class="input-wrapper">
                                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round">
                                        <rect width="20" height="16" x="2" y="4" rx="2" />
                                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                                    </svg>
                                    <input type="email" id="signup-email" class="form-input"
                                        placeholder="name@example.com" required>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="signup-password">Password</label>
                                <div class="input-wrapper">
                                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round">
                                        <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                    </svg>
                                    <input type="password" id="signup-password" class="form-input"
                                        placeholder="Create a password" required minlength="6">
                                </div>
                                <span class="form-hint"
                                    style="display:block; font-size:12px; color:#94a3b8; margin-top:6px;">Must be at
                                    least 6 characters</span>
                            </div>

                            <button type="submit" class="btn btn-primary">Create Account</button>
                        </form>

                        <div class="divider"><span>Or sign up with</span></div>

                        <button class="btn btn-outline" onclick="handleGoogleAuth()">
                            <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path fill="#4285F4"
                                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                                <path fill="#34A853"
                                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                                <path fill="#FBBC05"
                                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                                <path fill="#EA4335"
                                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                            </svg>
                            Sign up with Google
                        </button>

                        <div class="footer-link">
                            Already have an account? <a href="#" onclick="toggleView('login')">Sign in</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side: Hero Gradient -->
        <div class="auth-hero">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>

            <div class="hero-content">
                <div class="hero-icon">🚀</div>
                <h2 style="font-size: 2rem; font-weight: 700; margin-bottom: 1rem;">Join NextStep AI</h2>
                <p style="opacity: 0.8; font-size: 1.1rem; line-height: 1.6;">
                    Build your career with AI-powered guidance, resume analysis, and mock interviews.
                </p>
            </div>
        </div>
    </div>

    <script>
        function toggleView(view) {
            const loginView = document.getElementById('login-view');
            const signupView = document.getElementById('signup-view');
            const toggleBtns = document.querySelectorAll('.toggle-btn');

            if (view === 'login') {
                loginView.classList.remove('hidden');
                signupView.classList.add('hidden');
                toggleBtns[0].classList.add('active');
                toggleBtns[1].classList.remove('active');
            } else {
                loginView.classList.add('hidden');
                signupView.classList.remove('hidden');
                toggleBtns[0].classList.remove('active');
                toggleBtns[1].classList.add('active');
            }
        }

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('svg');

            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
            }
        }
    </script>
    <script type="module" src="js/auth-modern.js"></script>
    <script src="js/sw-register.js"></script>
</body>

</html>
